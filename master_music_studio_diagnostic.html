<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10121b"><title>Master Music Studio</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#edf0fa;background:#10121b;--panel:#1b1f2e;--panel2:#23283a;--stroke:#343b51;--muted:#a0a9bd;--purple:#ad93ff;--cyan:#70e2ed;--amber:#ffc477;--pink:#ff8fab}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 0% 0%,#27223d 0%,#10121b 48%);min-height:100dvh}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}input,textarea,select{background:#111522;color:#f1f3fb;border:1px solid #414960;border-radius:12px;padding:12px;width:100%;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--purple);box-shadow:0 0 0 2px #ad93ff22}textarea{resize:vertical;line-height:1.5;min-height:100px}input[type=checkbox]{width:18px;height:18px;accent-color:var(--purple)}input[type=range]{padding:0;accent-color:var(--purple)}.app{max-width:1160px;margin:auto;padding:20px 18px 110px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.logo{width:45px;height:45px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(140deg,#835ce2,#2d95a7);box-shadow:0 0 24px #ad93ff44;font-size:23px}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--cyan);font-weight:750;text-transform:uppercase}.brand h1{font-size:20px;margin:2px 0;letter-spacing:-.03em}.small{font-size:12px;color:var(--muted)}.headtools{display:flex;gap:8px}.btn{background:#30374e;color:#eef0fa;border:1px solid #48516a;border-radius:11px;padding:10px 13px;font-size:13px;font-weight:650;min-height:42px}.btn.primary{background:linear-gradient(120deg,#8665dd,#6450bb);border-color:#b59aff;color:white}.btn.cyan{background:#16424d;border-color:#337482;color:#b9f8ff}.btn.warn{background:#493324;border-color:#8c6140}.btn.ghost{background:transparent}.btn.tiny{padding:7px 10px;min-height:33px;font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.layout{display:grid;grid-template-columns:215px minmax(0,1fr);gap:18px}.sidebar,.panel{background:linear-gradient(155deg,#202437,#181c2a);border:1px solid #343a50;border-radius:19px;box-shadow:0 12px 40px #0003}.sidebar{padding:15px;align-self:start;position:sticky;top:16px}.nav{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:0;background:transparent;color:#b6bfd1;border-radius:11px;text-align:left;font-weight:650;margin:3px 0}.nav.active{background:#35304d;color:#eee7ff;box-shadow:inset 3px 0 var(--purple)}.nav .symbol{width:22px;text-align:center}.panel{padding:20px;margin-bottom:16px}.panel h2{margin:0;font-size:21px;letter-spacing:-.03em}.panel h3{font-size:15px;margin:0}.panelhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:16px}.chip{display:inline-flex;border:1px solid #49435e;background:#302a47;color:#d6c8ff;border-radius:30px;padding:5px 10px;font-size:11px;font-weight:750}.chip.cyan{border-color:#2f6973;background:#1c3c44;color:#9ef4ff}.chip.amber{border-color:#735738;background:#463625;color:#ffd99b}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}.field label{font-size:12px;color:#c1c9d8;font-weight:650}.hint{font-size:12px;color:var(--muted);line-height:1.5}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.space{justify-content:space-between}.rule{border-top:1px solid #394056;margin:17px 0}.card{padding:13px;border-radius:13px;background:#141927;border:1px solid #343c52}.card+.card{margin-top:9px}.card-title{font-weight:700;font-size:14px}.details{border:1px solid #3a4156;border-radius:13px;margin-top:12px;overflow:hidden}.details summary{cursor:pointer;padding:13px 15px;font-weight:700;color:#cbd2e2;background:#24293a}.details .inside{padding:14px}.toggle{display:flex;gap:9px;align-items:center;font-size:13px;color:#d8deeb;padding:5px 0}.count{font-variant-numeric:tabular-nums;font-size:12px;color:var(--cyan)}.count.bad{color:#ff939d}.output{min-height:190px}.status{font-size:12px;color:var(--muted)}.status.ok{color:#9be4be}.status.err{color:#ff9aab}.library-item{border:1px solid #3d455b;border-radius:12px;margin:9px 0;overflow:hidden}.library-item summary{padding:12px;cursor:pointer;background:#23283a}.library-item .inside{padding:12px}.pill{border-radius:20px;padding:3px 8px;background:#30394d;font-size:11px;color:#cbd3e2}.bottomnav{display:none}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#39415a;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;box-shadow:0 8px 30px #0009;font-size:13px;max-width:90vw}.empty{text-align:center;padding:30px 10px;color:#9da6b9}.accent{color:var(--purple)}.warning{color:#ffbe8e}.kbd{font-family:ui-monospace,monospace;font-size:11px;color:#b8c2d5}.metric{padding:12px;background:#141927;border:1px solid #3b4358;border-radius:13px}.metric strong{font-size:22px;display:block}.modalback{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:18px}.modal{width:min(480px,100%);background:#212637;border:1px solid #49516a;border-radius:19px;padding:20px}.hidden{display:none!important} @media(max-width:720px){.app{padding:14px 12px 105px}.layout{display:block}.sidebar{display:none}.panel{padding:16px;border-radius:17px}.brand h1{font-size:17px}.logo{width:40px;height:40px}.headtools .labeltext{display:none}.bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#1b2030ee;backdrop-filter:blur(18px);border-top:1px solid #41475e;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}.bottomnav button{border:0;background:transparent;color:#9ea9c0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;padding:7px 0}.bottomnav button.active{color:#c9b6ff}.bottomnav button span{font-size:20px}.grid2{grid-template-columns:1fr}.mobilegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mobilegrid .field{min-width:0}.toolbar .btn{flex:1}.panelhead{align-items:flex-start}.output{min-height:260px}}
</style><style>#mmsDiag{position:relative;z-index:99999;margin:12px 16px;padding:14px;background:#20283b;color:#f1f4ff;border:1px solid #67e8f9;border-radius:14px;font:14px -apple-system,sans-serif;overflow-wrap:anywhere}#mmsDiag strong{color:#67e8f9}#mmsDiag button{background:#a78bfa;color:#10121b;border:0;border-radius:8px;padding:10px 14px;font-weight:700;margin-top:8px}#mmsDiag pre{white-space:pre-wrap;font-size:12px;max-height:150px;overflow:auto}</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">◉</div><div><div class="eyebrow">Creative workspace / v0.1</div><h1>Master Music Studio</h1></div></div><div class="headtools"><button class="btn tiny" id="exportBtn" title="Export backup">⇩ <span class="labeltext">Backup</span></button><button class="btn tiny" id="settingsBtn" title="Settings">⚙</button></div></header><section id="mmsDiag"><strong>iPhone Diagnostic • D1</strong><div id="diagStatus">HTML loaded. JavaScript has not run.</div><div id="diagStorage">Storage: not tested</div><div id="diagInit">Studio initialization: not detected</div><button type="button" id="diagTap" onclick="document.getElementById('diagTapResult').textContent='Tap works: JavaScript enabled';">Test JavaScript tap</button><div id="diagTapResult">Tap test: waiting</div><pre id="diagErrors"></pre><noscript>JavaScript is disabled or blocked in this preview. Open in a JavaScript-capable browser.</noscript></section><script>(function(){var q=function(id){return document.getElementById(id)};q('diagStatus').textContent='JavaScript executed: YES';window.addEventListener('error',function(e){q('diagErrors').textContent+='ERROR: '+e.message+' at '+e.filename+':'+e.lineno+'\n'});window.addEventListener('unhandledrejection',function(e){q('diagErrors').textContent+='PROMISE: '+String(e.reason)+'\n'});try{var k='mms-diag-'+Date.now();localStorage.setItem(k,'ok');var v=localStorage.getItem(k);localStorage.removeItem(k);q('diagStorage').textContent='Storage: '+(v==='ok'?'READ/WRITE OK':'FAILED')}catch(e){q('diagStorage').textContent='Storage blocked: '+e.name+' — '+e.message}})();</script><div class="layout"><aside class="sidebar"><div class="eyebrow" style="margin:5px 8px 14px">Workspaces</div><div id="desktopNav"></div><div class="rule"></div><div class="small" style="padding:8px">LOCAL-FIRST FOUNDATION<br><br>Drafts and versions are saved in this browser. Export backups regularly.</div></aside><main id="main"></main></div></div><nav class="bottomnav" id="mobileNav"></nav><input type="file" id="importFile" accept="application/json,.json" hidden><div id="toast" class="toast hidden"></div><div id="modalRoot"></div>
<script>
(()=>{'use strict';const KEY='mms-v01';const uid=()=>globalThis.crypto?.randomUUID?.()||'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);const initial=()=>({schema:1,activeProject:null,projects:[],assets:[],experiments:[],settings:{maxChars:1000},work:{music:{style:'',mood:'Bittersweet',intro:'Gradual synth build',structure:'Evolving',tempo:'',energy:65,required:'',excluded:'',draft:'',title:'Untitled music prompt',locked:false},lyrics:{idea:'',voice:'Male solo',tone:'Bittersweet',structure:'Verse / Pre-Chorus / Chorus',adlibs:false,spoken:false,harmonies:false,callresponse:false,draft:'',title:'Untitled lyrics',locked:false}},tab:'music'});let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial()}catch{db=initial()}db={...initial(),...db,work:{...initial().work,...db.work}};if(!db.projects.length){db.projects=[{id:uid(),name:'iamthedevil',color:'#ad93ff',instrumental:false,identity:'Synthwave',defaults:{required:'Synthwave foundation; independent rhythmic synth patterns',excluded:'Country sound or accents; post-rock unless explicitly requested'}},{id:uid(),name:'Botrytis',color:'#70e2ed',instrumental:true,identity:'Instrumental synthwave / post-rock',defaults:{required:'Instrumental only; evolving layered guitars and independent synthesizers',excluded:'Vocals, sung words, spoken vocals'}}];db.activeProject=db.projects[0].id}let currentTab='music',libraryQuery='',libraryFilter='all',editorApproved={music:false,lyrics:false},editingId={music:null,lyrics:null},expandedSettings=false;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const project=()=>db.projects.find(p=>p.id===db.activeProject)||db.projects[0];const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('Storage unavailable or full. Export a backup.');return false}};const toast=m=>{let t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),3000)};const opts=(arr,val)=>arr.map(x=>`<option value="${esc(x)}" ${x===val?'selected':''}>${esc(x)}</option>`).join('');const navs=[['music','◈','Music'],['lyrics','✎','Lyrics'],['projects','▤','Projects'],['library','▣','Library'],['experiments','◷','Lab'],['artwork','▧','Artwork'],['settings','⚙','Settings']];function nav(){ $('#desktopNav').innerHTML=navs.map(([id,ic,label])=>`<button class="nav ${currentTab===id?'active':''}" data-tab="${id}"><span class="symbol">${ic}</span>${label}</button>`).join('');$('#mobileNav').innerHTML=[...navs.slice(0,4),['more','⋯','More']].map(([id,ic,label])=>`<button class="${currentTab===id||(id==='more'&&!navs.slice(0,4).some(x=>x[0]===currentTab))?'active':''}" data-tab="${id}"><span>${ic}</span>${label}</button>`).join('')}
function head(title,desc,chip=''){return `<div class="panelhead"><div><div class="eyebrow">${esc(project()?.name||'Workspace')}</div><h2>${title}</h2><div class="hint" style="margin-top:6px">${desc}</div></div>${chip?`<span class="chip">${chip}</span>`:''}</div>`}function field(label,control){return `<div class="field"><label>${label}</label>${control}</div>`}function select(name,arr,value){return `<select data-work="${name}">${opts(arr,value)}</select>`}function input(name,value,placeholder=''){return `<input data-work="${name}" value="${esc(value)}" placeholder="${esc(placeholder)}">`}function area(name,value,placeholder='',rows=4){return `<textarea data-work="${name}" rows="${rows}" placeholder="${esc(placeholder)}">${esc(value)}</textarea>`}function tick(name,label,value){return `<label class="toggle"><input type="checkbox" data-work="${name}" ${value?'checked':''}>${label}</label>`}function editor(kind){const w=db.work[kind],limit=db.settings.maxChars,valid=kind==='lyrics'||w.draft.length<=limit;return `<section class="panel" id="editorPanel"><div class="panelhead"><h3>${kind==='music'?'Music prompt editor':'Lyric draft editor'}</h3><span id="charCount" class="count ${valid?'':'bad'}">${kind==='music'?w.draft.length+' / '+limit:w.draft.length+' characters'}</span></div>${field('Title',input('title',w.title))}${area('draft',w.draft,kind==='music'?'Your music prompt will appear here...':'[Verse 1]\n\n[Chorus]\n',11)}<div class="row space"><span id="editorStatus" class="status ${editorApproved[kind]?'ok':''}">${editorApproved[kind]?'Approved — ready to save':'Draft — edit freely'}</span><span class="pill">${w.locked?'Protected':'Editable'}</span></div><div class="toolbar" style="margin-top:13px"><button class="btn" data-action="copy">Copy</button><button class="btn" data-action="approve">✓ Approve</button><button class="btn primary" data-action="save" ${!editorApproved[kind]||!valid||!w.draft.trim()?'disabled':''}>Save version</button><button class="btn ghost" data-action="protect">${w.locked?'Unlock':'Protect'}</button></div><div class="hint" style="margin-top:10px">Saving creates a versioned library entry. Protection prevents accidental edits to the approved source; drafts remain editable.</div></section>`}
function music(){const w=db.work.music,p=project();return `<section class="panel">${head('Music Architect','Build from approved musical architecture and explicit constraints.','≤ 1,000 chars')}<div class="grid2">${field('Architecture / preset',select('style',['Custom','Classic Synthwave','Micro Dose','Playful Electro-Funk','Dark Electro-Funk','Cinematic Synthwave','Hybrid Post-Rock','Spanish Guitar Fusion'],w.style||'Custom'))}${field('Mood',select('mood',['Bittersweet','Dark','Hopeful','Melancholic','Playful','Ominous','Triumphant','Tense','Dreamlike'],w.mood))}${field('Intro',select('intro',['Gradual synth build','Immediate groove','Minimal atmosphere','Bass-led','Arpeggio-first','Guitar motif','Cold open'],w.intro))}${field('Arrangement',select('structure',['Evolving','Traditional','Nonlinear','Minimal','Crescendo-driven','Breakdown-focused'],w.structure))}${field('Tempo / BPM',input('tempo',w.tempo,'e.g. 108 BPM'))}<div class="field"><label>Energy <span id="energyValue">${w.energy}</span>%</label><input type="range" min="0" max="100" step="5" data-work="energy" value="${w.energy}"></div></div><details class="details" ${expandedSettings?'open':''} id="constraintDetails"><summary>⚿ Required elements & exclusion rules</summary><div class="inside">${field('Required elements (locked IN)',area('required',w.required||p.defaults.required,'Essential instructions to preserve'))}${field('Excluded elements (locked OUT)',area('excluded',w.excluded||p.defaults.excluded,'Instructions to prohibit'))}<div class="hint">Project defaults are prefilled until customized. Conflicts are flagged before assembly. Protected baselines are not overwritten.</div></div></details><div class="toolbar" style="margin-top:16px"><button class="btn primary" data-action="assemble">Assemble draft</button><button class="btn cyan" data-action="ai-music">Prepare GPT-6 request ↗</button></div><div id="conflicts" class="status" style="margin-top:10px"></div><div class="hint" style="margin-top:12px">Assembly is local and deterministic. The GPT-6 button prepares a request for use in ChatGPT; it does not silently call a paid API.</div></section>${editor('music')}`}
function lyrics(){const w=db.work.lyrics;return `<section class="panel">${head('Lyrics Composer','Describe the concept, configure the performance, then edit and approve the result.','Editable')} ${field('Song idea / story',area('idea',w.idea,'Describe the song, characters, perspective, imagery, specific lines, and emotional arc...',5))}<div class="grid2">${field('Vocal arrangement',select('voice',['Male solo','Female solo','Male/Female duet','Two male voices','Two female voices','Ensemble','No vocals'],project().instrumental?'No vocals':w.voice))}${field('Lyrical tone',select('tone',['Bittersweet','Melancholic','Romantic','Dark','Playful','Satirical','Hopeful','Angry','Introspective'],w.tone))}${field('Song structure',select('structure',['Verse / Pre-Chorus / Chorus','Verse / Chorus / Bridge','Narrative / Evolving','Minimal / Repetitive','Experimental / Nonlinear','Custom'],w.structure))}</div><details class="details" open><summary>Vocal details & delivery</summary><div class="inside mobilegrid">${tick('adlibs','Ad-libs / exclamations',w.adlibs)}${tick('spoken','Spoken passages',w.spoken)}${tick('harmonies','Backing harmonies',w.harmonies)}${tick('callresponse','Call & response',w.callresponse)}</div></details><div class="toolbar" style="margin-top:16px"><button class="btn primary" data-action="lyric-template">Insert section template</button><button class="btn cyan" data-action="ai-lyrics">Prepare GPT-6 request ↗</button></div><div class="hint" style="margin-top:12px">GPT-6 generation opens a copyable instruction. Paste the returned lyrics into the editor; the Plus-only workflow cannot auto-fill this standalone page.</div></section>${editor('lyrics')}`}
function projects(){return `<section class="panel">${head('Song Projects','Independent musical identities and reusable libraries.','Dynamic')}<div class="toolbar"><button class="btn primary" data-action="new-project">+ New project</button></div><div style="margin-top:15px">${db.projects.map(p=>`<div class="card"><div class="row space"><div><div class="card-title"><span style="color:${esc(p.color)}">●</span> ${esc(p.name)} ${p.id===db.activeProject?'<span class="chip cyan">Active</span>':''}</div><div class="hint">${esc(p.identity)} · ${p.instrumental?'Instrumental only':'Vocals permitted'}</div></div><button class="btn tiny" data-action="activate-project" data-id="${p.id}">Open</button></div><div class="toolbar" style="margin-top:9px"><button class="btn tiny ghost" data-action="edit-project" data-id="${p.id}">Edit</button><button class="btn tiny ghost" data-action="duplicate-project" data-id="${p.id}">Duplicate</button><button class="btn tiny ghost" data-action="delete-project" data-id="${p.id}">Archive</button></div></div>`).join('')}</div></section><section class="panel"><h3>Current project defaults</h3><p class="hint">${esc(project().defaults.required)}<br><br>Excluded: ${esc(project().defaults.excluded)}</p></section>`}
function library(){const filtered=db.assets.filter(a=>(libraryFilter==='all'||a.kind===libraryFilter)&&(!libraryQuery||[a.title,a.content,a.projectName].join(' ').toLowerCase().includes(libraryQuery.toLowerCase())));return `<section class="panel">${head('Master Library','Approved content, protected baselines and version history.','Local storage')}<div class="grid2">${field('Search',`<input id="librarySearch" placeholder="Title, text, project..." value="${esc(libraryQuery)}">`)}${field('Type',`<select id="libraryFilter">${opts(['all','music','lyrics','artwork'],libraryFilter)}</select>`)}</div><div id="libraryItems">${filtered.length?filtered.slice().reverse().map(a=>`<details class="library-item"><summary><div class="row space"><span><strong>${esc(a.title)}</strong><br><span class="small">${esc(a.projectName)} · ${esc(a.kind)} · v${a.version} · ${new Date(a.created).toLocaleDateString()}</span></span><span class="pill">${a.protected?'Protected':'Approved'}</span></div></summary><div class="inside"><div class="hint" style="white-space:pre-wrap;max-height:240px;overflow:auto">${esc(a.content.slice(0,3000))}</div><div class="toolbar" style="margin-top:12px"><button class="btn tiny" data-action="load-asset" data-id="${a.id}">Open as draft</button><button class="btn tiny" data-action="copy-asset" data-id="${a.id}">Copy</button><button class="btn tiny ghost" data-action="protect-asset" data-id="${a.id}">${a.protected?'Unprotect':'Protect'}</button></div></div></details>`).join(''):'<div class="empty">No saved assets match your search.<br><br>Approve and save a music prompt or lyric set to start your library.</div>'}</div></section>`}
function experiments(){let es=db.experiments.filter(e=>e.projectId===db.activeProject);return `<section class="panel">${head('Experiment Lab','Rate results Yes / No / Maybe to learn what works.','Tracking')}<div class="grid2">${field('Prompt / test label','<input id="expTitle" placeholder="e.g. Micro Dose — v6 dark">')}${field('Generator model',`<select id="expModel">${opts(['v5','v5.5','v6','Other'],'v6')}</select>`)}</div>${field('Observations','<textarea id="expNotes" rows="3" placeholder="What worked? What changed? Any problems?"></textarea>')}<div class="toolbar"><button class="btn cyan" data-action="rate" data-rating="Yes">✓ Yes</button><button class="btn" data-action="rate" data-rating="Maybe">~ Maybe</button><button class="btn warn" data-action="rate" data-rating="No">✕ No</button></div><div class="rule"></div>${es.length?es.slice().reverse().map(e=>`<div class="card"><div class="row space"><strong>${esc(e.title)}</strong><span class="chip ${e.rating==='Yes'?'cyan':e.rating==='Maybe'?'amber':''}">${e.rating}</span></div><div class="small">${esc(e.model)} · ${new Date(e.created).toLocaleDateString()}</div><p class="hint">${esc(e.notes)}</p></div>`).join(''):'<div class="empty">No experiments logged for this project.</div>'}</section>`}
function artwork(){return `<section class="panel">${head('Artwork Studio','Prepare visual concepts and organize approved artwork.','Plus-only')}<div class="card"><div class="card-title">Artwork prompt planner</div><p class="hint">Draft a visual brief using your song context. Image generation itself happens in ChatGPT’s built-in image tool, not through a separately billed API.</p>${field('Visual concept','<textarea id="artConcept" rows="4" placeholder="Describe the scene, subject, atmosphere, palette, composition..."></textarea>')}<label class="toggle"><input id="artContext" type="checkbox" checked> Include current project identity and defaults</label><label class="toggle"><input id="artAlbum" type="checkbox"> Inherit existing album visual direction (describe it in the concept)</label><div class="toolbar" style="margin-top:12px"><button class="btn cyan" data-action="art-request">Copy image request</button></div></div><div class="card"><div class="card-title">Artwork archive</div><p class="hint">You can record artwork references and descriptions here. Image files are not embedded into local storage in this milestone; that requires a dedicated asset-storage layer.</p>${field('Artwork title','<input id="artTitle" placeholder="Cover concept v1">')}${field('File reference or notes','<textarea id="artNotes" rows="3" placeholder="Filename, visual notes, approval rationale..."></textarea>')}<button class="btn primary" data-action="save-art">Save artwork record</button></div></section>`}
function settings(){return `<section class="panel">${head('Studio Settings','Portable backups and storage safeguards.','v0.1')}<div class="card"><h3>Prompt validation</h3><p class="hint">Music prompts must remain at or below 1,000 characters.</p><input id="maxChars" type="number" min="100" max="10000" value="${db.settings.maxChars}"></div><div class="card"><h3>Data portability</h3><p class="hint">This file uses browser-local storage, which can be cleared by iOS or when Safari website data is removed. Export backups regularly. Opening the HTML from different browser contexts may not share storage.</p><div class="toolbar"><button class="btn cyan" data-action="export">Export JSON backup</button><button class="btn" data-action="import">Import backup</button></div></div><div class="card"><h3>Generation integration</h3><p class="hint">No API keys, third-party services, hosting, or additional subscriptions are required. GPT-6 and image generation remain native ChatGPT actions, with manual transfer between this page and the conversation.</p></div></section>`}
function render(){nav();$('#main').innerHTML=({music,lyrics,projects,library,experiments,artwork,settings}[currentTab]||music)();}function switchTab(t){if(t==='more'){const names=navs.slice(4).map(x=>x[2]).join(' / ');modal(`<h3>More workspaces</h3><div class="toolbar" style="margin-top:16px">${navs.slice(4).map(([id,ic,label])=>`<button class="btn" data-tab="${id}">${ic} ${label}</button>`).join('')}</div>`);return}currentTab=t;render();window.scrollTo({top:0,behavior:'instant'})}function modal(html){$('#modalRoot').innerHTML=`<div class="modalback"><div class="modal"><div class="row space"><span class="eyebrow">Master Music Studio</span><button class="btn tiny ghost" data-action="close-modal">✕</button></div><div style="margin-top:12px">${html}</div></div></div>`}function closeModal(){$('#modalRoot').innerHTML=''}function assemble(){let w=db.work.music,p=project();let required=(w.required||p.defaults.required).trim(),excluded=(w.excluded||p.defaults.excluded).trim();let collisions=[];if(p.instrumental&&/\b(vocal|sing|lyrics|duet|male solo|female solo)\b/i.test(required)&&!/instrumental|no vocal/i.test(required))collisions.push('Project is instrumental-only, but required text requests vocals.');if(/\bcountry\b/i.test(required)&&/\bcountry\b/i.test(excluded))collisions.push('Country appears in both required and excluded elements.');let reqTokens=required.toLowerCase().split(/[;,]/).map(x=>x.trim()).filter(x=>x.length>6);for(let x of reqTokens){if(excluded.toLowerCase().split(/[;,]/).some(y=>y.trim()===x))collisions.push('Required/excluded overlap: '+x)}if(collisions.length){$('#conflicts').textContent=collisions.join(' ');$('#conflicts').className='status err';toast('Resolve conflicting constraints first');return}let txt=`${w.style||'Custom'} musical architecture. ${w.mood} mood; ${w.intro.toLowerCase()}. ${w.structure.toLowerCase()} arrangement${w.tempo?', '+w.tempo:''}. Energy ${w.energy}/100. ${required?'Required: '+required+'. ':''}${excluded?'Avoid: '+excluded+'. ':''}${p.instrumental?'Strictly instrumental; no vocals.':''}`.replace(/\s+/g,' ').trim();if(txt.length>db.settings.maxChars){toast('Draft exceeds '+db.settings.maxChars+' characters. Shorten selections or constraints.');return}w.draft=txt;editorApproved.music=false;editingId.music=null;persist();render();toast('Draft assembled and character-verified')}function makeRequest(kind){let w=db.work[kind],p=project(),str=kind==='music'?`Develop a production-ready musicgeneratorai.com music-only prompt. Preserve established architecture where available. Project: ${p.name}. Musical identity: ${p.identity}. Style: ${w.style}. Mood: ${w.mood}. Intro: ${w.intro}. Structure: ${w.structure}. Tempo: ${w.tempo||'flexible'}. Energy: ${w.energy}/100. Required: ${w.required||p.defaults.required}. Excluded: ${w.excluded||p.defaults.excluded}. ${p.instrumental?'Strictly instrumental.':''} Return ONLY the finished prompt, maximum ${db.settings.maxChars} characters, programmatically verified. No explanation.`:`Generate complete, original song lyrics. Return ONLY a title and labeled lyric sections, with no surrounding commentary. Concept: ${w.idea}. Project: ${p.name}. Vocal arrangement: ${p.instrumental?'No vocals':w.voice}. Tone: ${w.tone}. Structure: ${w.structure}. Ad-libs: ${w.adlibs}. Spoken passages: ${w.spoken}. Backing harmonies: ${w.harmonies}. Call and response: ${w.callresponse}. No country styling or accents unless explicitly requested.`;navigator.clipboard?.writeText(str).then(()=>toast('GPT-6 request copied — paste into ChatGPT')).catch(()=>modal(`<h3>Copy request into ChatGPT</h3><textarea rows="12" readonly>${esc(str)}</textarea>`));}function approve(){let w=db.work[currentTab];if(!w.draft.trim()){toast('Draft is empty');return}if(currentTab==='music'&&w.draft.length>db.settings.maxChars){toast('Over character limit');return}editorApproved[currentTab]=true;render();toast('Approved — save a version to the library')}function save(){let kind=currentTab,w=db.work[kind];if(!editorApproved[kind]||!w.draft.trim())return;let prior=db.assets.filter(a=>a.kind===kind&&a.projectId===db.activeProject&&a.title===w.title);let version=prior.length?Math.max(...prior.map(a=>a.version))+1:1;db.assets.push({id:uid(),kind,title:w.title,content:w.draft,projectId:db.activeProject,projectName:project().name,version,protected:w.locked,created:Date.now()});editorApproved[kind]=false;editingId[kind]=null;persist();render();toast('Saved v'+version+' to library')}function download(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function projectForm(id=null){let p=db.projects.find(x=>x.id===id)||{name:'',identity:'',color:'#ad93ff',instrumental:false,defaults:{required:'',excluded:''}};modal(`<h3>${id?'Edit':'Create'} project</h3><div style="margin-top:15px">${field('Name',`<input id="pName" value="${esc(p.name)}" placeholder="Project name">`)}${field('Musical identity',`<input id="pIdentity" value="${esc(p.identity)}" placeholder="Genres, instrumentation, aesthetic">`)}${field('Accent color',`<input id="pColor" type="color" value="${esc(p.color)}">`)}<label class="toggle"><input id="pInstrumental" type="checkbox" ${p.instrumental?'checked':''}> Strictly instrumental / no vocals</label>${field('Default required elements',`<textarea id="pRequired" rows="3">${esc(p.defaults.required)}</textarea>`)}${field('Default excluded elements',`<textarea id="pExcluded" rows="3">${esc(p.defaults.excluded)}</textarea>`)}<button class="btn primary" data-action="submit-project" data-id="${id||''}">Save project</button></div>`)}function handleAction(a,el){let kind=currentTab,w=db.work[kind];switch(a){case'assemble':assemble();break;case'ai-music':makeRequest('music');break;case'ai-lyrics':if(!w.idea.trim()){toast('Enter a song concept first');return}makeRequest('lyrics');break;case'lyric-template':w.draft=['[Verse 1]','','[Pre-Chorus]','','[Chorus]','','[Verse 2]','','[Bridge]','','[Final Chorus]'].join('\n');editorApproved.lyrics=false;persist();render();break;case'copy':navigator.clipboard?.writeText(w.draft).then(()=>toast('Copied')).catch(()=>toast('Select text and copy'));break;case'approve':approve();break;case'save':save();break;case'protect':w.locked=!w.locked;persist();render();break;case'new-project':projectForm();break;case'edit-project':projectForm(el.dataset.id);break;case'activate-project':db.activeProject=el.dataset.id;persist();render();toast('Project switched');break;case'duplicate-project':{let p=db.projects.find(x=>x.id===el.dataset.id);db.projects.push({...structuredClone(p),id:uid(),name:p.name+' Copy'});persist();render();break}case'delete-project':{let p=db.projects.find(x=>x.id===el.dataset.id);if(db.projects.length===1){toast('Keep at least one project');return}if(!confirm('Archive project "'+p.name+'"? This prototype removes the project from the active list; export a backup first.'))return;db.projects=db.projects.filter(x=>x.id!==p.id);if(db.activeProject===p.id)db.activeProject=db.projects[0].id;persist();render();break}case'close-modal':closeModal();break;case'submit-project':{let name=$('#pName').value.trim();if(!name){toast('Project name required');return}let id=el.dataset.id;let data={name,identity:$('#pIdentity').value.trim(),color:$('#pColor').value,instrumental:$('#pInstrumental').checked,defaults:{required:$('#pRequired').value,excluded:$('#pExcluded').value}};if(id){Object.assign(db.projects.find(p=>p.id===id),data)}else{let p={...data,id:uid()};db.projects.push(p);db.activeProject=p.id}closeModal();persist();render();break}case'load-asset':{let a=db.assets.find(x=>x.id===el.dataset.id);if(!a||!['music','lyrics'].includes(a.kind)){toast('This record cannot be opened in an editor');return}db.activeProject=a.projectId;db.work[a.kind].draft=a.content;db.work[a.kind].title=a.title;db.work[a.kind].locked=false;editorApproved[a.kind]=false;currentTab=a.kind;persist();render();toast('Loaded as editable draft; source unchanged');break}case'copy-asset':{let a=db.assets.find(x=>x.id===el.dataset.id);navigator.clipboard?.writeText(a.content).then(()=>toast('Copied'));break}case'protect-asset':{let a=db.assets.find(x=>x.id===el.dataset.id);a.protected=!a.protected;persist();render();break}case'rate':{let title=$('#expTitle').value.trim();if(!title){toast('Enter test label');return}db.experiments.push({id:uid(),projectId:db.activeProject,title,model:$('#expModel').value,notes:$('#expNotes').value,rating:el.dataset.rating,created:Date.now()});persist();render();toast('Experiment logged');break}case'export':download(db,'master-music-studio-backup.json');break;case'import':$('#importFile').click();break;case'art-request':{let concept=$('#artConcept').value.trim();if(!concept){toast('Enter a visual concept');return}let str=`Create an image for ${project().name}. ${concept}. ${$('#artContext').checked?'Project identity: '+project().identity+'. ':''}${$('#artAlbum').checked?'Preserve the established album artwork identity. ':''}Return the image without conversational explanation.`;navigator.clipboard?.writeText(str).then(()=>toast('Image request copied'));break}case'save-art':{let title=$('#artTitle').value.trim();if(!title){toast('Enter artwork title');return}db.assets.push({id:uid(),kind:'artwork',title,content:$('#artNotes').value,projectId:db.activeProject,projectName:project().name,version:1,protected:false,created:Date.now()});persist();render();toast('Artwork record saved');break}}}
document.addEventListener('click',e=>{let tab=e.target.closest('[data-tab]');if(tab){closeModal();switchTab(tab.dataset.tab);return}let action=e.target.closest('[data-action]');if(action)handleAction(action.dataset.action,action)});document.addEventListener('input',e=>{let el=e.target;if(el.dataset.work){let w=db.work[currentTab];if(!w)return;w[el.dataset.work]=el.type==='checkbox'?el.checked:el.type==='range'?Number(el.value):el.value;if(el.dataset.work==='draft'||el.dataset.work==='title'){editorApproved[currentTab]=false;let st=$('#editorStatus');if(st){st.textContent='Draft — edit freely';st.className='status'}let b=document.querySelector('[data-action="save"]');if(b)b.disabled=true}if(el.dataset.work==='draft'){let c=$('#charCount');if(c){c.textContent=currentTab==='music'?w.draft.length+' / '+db.settings.maxChars:w.draft.length+' characters';c.className='count '+(currentTab==='music'&&w.draft.length>db.settings.maxChars?'bad':'')}}if(el.dataset.work==='energy')$('#energyValue').textContent=el.value;persist()}if(el.id==='librarySearch'){libraryQuery=el.value;let caret=el.selectionStart;render();let i=$('#librarySearch');i.focus();i.setSelectionRange(caret,caret)}if(el.id==='maxChars'){db.settings.maxChars=Math.max(100,Number(el.value)||1000);persist()}});document.addEventListener('change',e=>{let el=e.target;if(el.dataset.work){db.work[currentTab][el.dataset.work]=el.type==='checkbox'?el.checked:el.value;persist()}if(el.id==='libraryFilter'){libraryFilter=el.value;render()}if(el.id==='constraintDetails')expandedSettings=el.open});$('#settingsBtn').onclick=()=>switchTab('settings');$('#exportBtn').onclick=()=>download(db,'master-music-studio-backup.json');$('#importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.projects)||!Array.isArray(d.assets)||!d.work||!confirm('Replace current local data with this backup? Export your current data first.'))return;db=d;db.settings??={maxChars:1000};db.experiments??=[];db.work={...initial().work,...db.work};persist();render();toast('Backup restored')}catch{toast('Invalid backup file')}e.target.value=''});render();document.getElementById('diagInit').textContent='Studio initialization: SUCCESS';})();
</script><script>if(document.getElementById('diagInit').textContent.indexOf('SUCCESS')<0){document.getElementById('diagInit').textContent='Studio initialization: FAILED or blocked';}</script></body></html>
